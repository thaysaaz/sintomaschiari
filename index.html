<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sintomas · Acompanhamento</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a78d6">
<style>
  :root{
    color-scheme: light;
    --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e;
    --muted:#898781; --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --accent:#2a78d6; --accent-ink:#ffffff;
    --lvl0:#c3c2b7; --lvl0-fill:#eeede8;
    --lvl1:#0ca30c; --lvl1-ink:#ffffff;
    --lvl2:#fab219; --lvl2-ink:#241a00;
    --lvl3:#d03b3b; --lvl3-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --surface:#1a1a19; --page:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7;
      --muted:#898781; --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --accent:#3987e5; --accent-ink:#ffffff;
      --lvl0:#383835; --lvl0-fill:#232322;
      --lvl1:#0ca30c; --lvl1-ink:#ffffff;
      --lvl2:#fab219; --lvl2-ink:#241a00;
      --lvl3:#d03b3b; --lvl3-ink:#ffffff;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{padding-bottom:78px;}
  h1,h2,h3{margin:0;}
  button{font-family:inherit;}
  #app{max-width:560px;margin:0 auto;}
  header.top{padding:18px 16px 10px;position:sticky;top:0;background:var(--page);z-index:5;}
  header.top .title{font-size:19px;font-weight:700;}
  header.top .date{font-size:14px;color:var(--ink2);margin-top:2px;}
  .hint{font-size:12.5px;color:var(--muted);margin:6px 16px 14px;line-height:1.4;}
  main{padding:0 16px 24px;}
  .saved-toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(140%);
    background:var(--lvl1);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;
    transition:transform .25s ease, opacity .25s ease;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15);opacity:0;}
  .saved-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);align-items:center;}
  .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}

  .valsalva{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .valsalva p{font-size:14.5px;line-height:1.35;margin:0;flex:1;}
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0;}
  .seg button{border:none;background:var(--surface);color:var(--ink2);font-size:13px;font-weight:600;
    padding:9px 12px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);}

  .symptom-row{padding:12px 0;border-top:1px solid var(--grid);}
  .symptom-row:first-child{border-top:none;}
  .symptom-row .name{font-size:14.5px;font-weight:600;margin-bottom:8px;}
  .lvl-row{display:flex;gap:8px;}
  .lvl-btn{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--grid);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--ink2);
    cursor:pointer;}
  .lvl-btn[data-lvl="0"]{color:var(--muted);}
  .lvl-btn.sel[data-lvl="0"]{background:var(--lvl0-fill);border-color:var(--lvl0);color:var(--ink2);}
  .lvl-btn.sel[data-lvl="1"]{background:var(--lvl1);border-color:var(--lvl1);color:var(--lvl1-ink);}
  .lvl-btn.sel[data-lvl="2"]{background:var(--lvl2);border-color:var(--lvl2);color:var(--lvl2-ink);}
  .lvl-btn.sel[data-lvl="3"]{background:var(--lvl3);border-color:var(--lvl3);color:var(--lvl3-ink);}
  .sub-label{font-size:11.5px;color:var(--muted);margin-top:6px;height:14px;}
  .outro-input{width:100%;margin-top:8px;padding:9px 10px;border-radius:8px;border:1px solid var(--grid);
    background:var(--page);color:var(--ink);font-size:13.5px;}

  textarea{width:100%;min-height:80px;border-radius:10px;border:1px solid var(--grid);background:var(--page);
    color:var(--ink);font-size:14px;padding:10px;font-family:inherit;resize:vertical;}
  label.field-label{font-size:13px;font-weight:600;color:var(--ink2);display:block;margin:0 0 6px;}

  /* Histórico */
  .day-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;
    margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;}
  .day-card .d-left{flex:1;min-width:0;}
  .day-card .d-date{font-size:14.5px;font-weight:700;}
  .day-card .d-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .day-card .d-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .mini-dot{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:20px;background:var(--lvl0-fill);color:var(--ink2);}
  .mini-dot.l1{background:var(--lvl1);color:var(--lvl1-ink);}
  .mini-dot.l2{background:var(--lvl2);color:var(--lvl2-ink);}
  .mini-dot.l3{background:var(--lvl3);color:var(--lvl3-ink);}
  .chev{color:var(--muted);font-size:20px;flex-shrink:0;}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:40px 10px;}

  .add-day-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-day-row input[type="date"]{flex:1;padding:10px;border-radius:10px;border:1px solid var(--grid);
    background:var(--surface);color:var(--ink);font-size:14px;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:10px 16px;
    font-size:14px;font-weight:700;cursor:pointer;}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--grid);}
  .btn.danger{background:var(--surface);color:var(--lvl3);border:1px solid var(--lvl3);}
  .btn.block{width:100%;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;}
  .modal-backdrop.open{display:block;}
  .modal{position:fixed;left:0;right:0;bottom:0;top:6%;background:var(--page);z-index:41;border-radius:18px 18px 0 0;
    display:none;flex-direction:column;overflow:hidden;}
  .modal.open{display:flex;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--grid);}
  .modal-head .m-title{font-size:15.5px;font-weight:700;}
  .modal-close{background:none;border:none;font-size:22px;color:var(--ink2);cursor:pointer;padding:4px 8px;}
  .modal-body{overflow-y:auto;padding:14px 16px 24px;flex:1;}

  /* Resumo / print */
  .field{margin-bottom:14px;}
  input.text{width:100%;padding:10px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);
    color:var(--ink);font-size:14px;}
  .stat-row{display:flex;gap:10px;margin-bottom:14px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
  .stat .n{font-size:19px;font-weight:800;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
  table.matrix{border-collapse:collapse;width:100%;font-size:11px;}
  table.matrix th,table.matrix td{border:1px solid var(--grid);padding:5px 4px;text-align:center;}
  table.matrix th{background:var(--surface);color:var(--ink2);font-weight:600;font-size:10px;}
  table.matrix td.sym-name{text-align:left;font-weight:600;font-size:11px;white-space:nowrap;background:var(--surface);}
  table.matrix .cell0{color:var(--muted);}
  table.matrix .cell1{background:var(--lvl1);color:var(--lvl1-ink);font-weight:700;}
  table.matrix .cell2{background:var(--lvl2);color:var(--lvl2-ink);font-weight:700;}
  table.matrix .cell3{background:var(--lvl3);color:var(--lvl3-ink);font-weight:700;}
  .matrix-wrap{overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
  .obs-item{padding:9px 0;border-top:1px solid var(--grid);font-size:13px;}
  .obs-item:first-child{border-top:none;}
  .obs-item .o-date{font-weight:700;font-size:12.5px;}
  .obs-item .o-flag{display:inline-block;margin-left:6px;font-size:10.5px;background:var(--lvl2);color:var(--lvl2-ink);
    padding:1px 6px;border-radius:8px;font-weight:700;}
  .section-title{font-size:13.5px;font-weight:700;margin:18px 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;}

  /* Bottom nav */
  nav.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
    display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10;max-width:560px;margin:0 auto;}
  nav.bottomnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;}
  nav.bottomnav button .ic{font-size:19px;}
  nav.bottomnav button.active{color:var(--accent);}

  @media print{
    body{padding-bottom:0;background:#fff;color:#000;}
    header.top,nav.bottomnav,#view-hoje,#view-historico,.no-print,.saved-toast{display:none !important;}
    #view-resumo{display:block !important;padding:0;}
    .card{border:none;padding:0;}
    table.matrix .cell1,table.matrix .cell2,table.matrix .cell3{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title">🩺 Acompanhamento de sintomas</div>
    <div class="date" id="header-date"></div>
  </header>

  <main id="view-hoje"></main>
  <main id="view-historico" hidden></main>
  <main id="view-resumo" hidden></main>

  <nav class="bottomnav no-print">
    <button data-view="hoje" class="active"><span class="ic">✅</span>Hoje</button>
    <button data-view="historico"><span class="ic">🗂️</span>Histórico</button>
    <button data-view="resumo"><span class="ic">📋</span>Resumo</button>
  </nav>
</div>

<div class="saved-toast no-print" id="toast">Salvo ✓</div>

<div class="modal-backdrop no-print" id="modal-backdrop"></div>
<div class="modal no-print" id="modal">
  <div class="modal-head">
    <div class="m-title" id="modal-title">Dia</div>
    <button class="modal-close" id="modal-close">✕</button>
  </div>
  <div class="modal-body" id="modal-body"></div>
</div>

<script>
(function(){
  "use strict";

  var SYMPTOMS = [
    {id:'dor_cabeca',   label:'Dor de cabeça'},
    {id:'dor_nuca',     label:'Dor / pressão na nuca'},
    {id:'tontura',      label:'Tontura / vertigem'},
    {id:'desequilibrio',label:'Desequilíbrio ao andar'},
    {id:'formigamento', label:'Formigamento / dormência'},
    {id:'fraqueza',     label:'Fraqueza em braços/pernas'},
    {id:'visao',        label:'Alterações visuais'},
    {id:'zumbido',      label:'Zumbido / alteração auditiva'},
    {id:'engasgo',      label:'Engolir / engasgos'},
    {id:'voz',          label:'Alteração da voz / rouquidão'},
    {id:'sono',         label:'Alteração do sono'},
    {id:'urinario',     label:'Alt. urinárias / intestinais'},
    {id:'outro',        label:'Outro sintoma'}
  ];
  var LEVELS = [
    {v:0,label:'Não ocorreu'},
    {v:1,label:'Leve'},
    {v:2,label:'Moderado'},
    {v:3,label:'Forte'}
  ];
  var STORAGE_KEY = 'chiari_sintomas_v1';
  var WEEKDAYS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  var WEEKDAYS_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var MONTHS_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {patientName:'', entries:{}};
  }
  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  }
  var DATA = loadData();

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function parseKey(key){
    var p = key.split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function longDateLabel(key){
    var d = parseKey(key);
    return WEEKDAYS[d.getDay()]+', '+pad(d.getDate())+' de '+ ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][d.getMonth()];
  }
  function shortDateLabel(key){
    var d = parseKey(key);
    return WEEKDAYS_SHORT[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1);
  }
  function matrixDateLabel(key){
    var d = parseKey(key);
    return pad(d.getDate())+'/'+pad(d.getMonth()+1);
  }

  function getEntry(key){
    if(!DATA.entries[key]){
      DATA.entries[key] = {vals:{}, outro_desc:'', valsalva:null, obs:''};
    }
    return DATA.entries[key];
  }

  var toastTimer = null;
  function showToast(){
    var t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1100);
  }

  // ---------- Day form (reused for "Hoje" and for editing in modal) ----------
  function renderDayForm(key, container, onSave){
    var entry = getEntry(key);
    var html = '';
    html += '<div class="card">';
    html += '<div class="legend"><span><span class="dot" style="background:var(--lvl0-fill);border:1px solid var(--lvl0)"></span>0 não ocorreu</span>';
    html += '<span><span class="dot" style="background:var(--lvl1)"></span>1 leve</span>';
    html += '<span><span class="dot" style="background:var(--lvl2)"></span>2 moderado</span>';
    html += '<span><span class="dot" style="background:var(--lvl3)"></span>3 forte</span></div>';
    html += '</div>';

    html += '<div class="card valsalva">';
    html += '<p>Hoje piorou tossindo, espirrando, se abaixando ou fazendo esforço?</p>';
    html += '<div class="seg" data-field="valsalva">';
    html += '<button data-val="sim" class="'+(entry.valsalva===true?'on':'')+'">Sim</button>';
    html += '<button data-val="nao" class="'+(entry.valsalva===false?'on':'')+'">Não</button>';
    html += '</div></div>';

    html += '<div class="card">';
    SYMPTOMS.forEach(function(s){
      var v = entry.vals[s.id];
      var vLabel = (v===undefined) ? '' : LEVELS[v].label;
      html += '<div class="symptom-row" data-symptom="'+s.id+'">';
      html += '<div class="name">'+s.label+'</div>';
      html += '<div class="lvl-row">';
      LEVELS.forEach(function(l){
        html += '<button class="lvl-btn '+(v===l.v?'sel':'')+'" data-lvl="'+l.v+'">'+l.v+'</button>';
      });
      html += '</div>';
      html += '<div class="sub-label">'+vLabel+'</div>';
      if(s.id==='outro'){
        html += '<input type="text" class="outro-input" placeholder="Qual sintoma?" value="'+escapeHtml(entry.outro_desc||'')+'" '+(v ? '' : 'style="display:none"')+' data-outro-desc>';
      }
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="card">';
    html += '<label class="field-label">Observações do dia (opcional)</label>';
    html += '<textarea placeholder="Ex: dor forte de manhã, melhorou após remédio, episódio ao se abaixar..." data-field="obs">'+escapeHtml(entry.obs||'')+'</textarea>';
    html += '</div>';

    container.innerHTML = html;

    // wire events
    container.querySelectorAll('.seg[data-field="valsalva"] button').forEach(function(btn){
      btn.addEventListener('click', function(){
        entry.valsalva = (btn.getAttribute('data-val')==='sim');
        saveData(); showToast();
        renderDayForm(key, container, onSave);
        if(onSave) onSave();
      });
    });
    container.querySelectorAll('.symptom-row').forEach(function(row){
      var symId = row.getAttribute('data-symptom');
      row.querySelectorAll('.lvl-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var lvl = parseInt(btn.getAttribute('data-lvl'),10);
          entry.vals[symId] = lvl;
          saveData(); showToast();
          renderDayForm(key, container, onSave);
          if(onSave) onSave();
        });
      });
      var outroInput = row.querySelector('[data-outro-desc]');
      if(outroInput){
        outroInput.addEventListener('input', function(){
          entry.outro_desc = outroInput.value;
          saveData();
        });
        outroInput.addEventListener('blur', function(){ if(onSave) onSave(); });
      }
    });
    var obsField = container.querySelector('[data-field="obs"]');
    var obsTimer;
    obsField.addEventListener('input', function(){
      entry.obs = obsField.value;
      clearTimeout(obsTimer);
      obsTimer = setTimeout(function(){ saveData(); showToast(); if(onSave) onSave(); }, 500);
    });
  }

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- Views ----------
  function renderHoje(){
    var el = document.getElementById('view-hoje');
    var key = todayKey();
    el.innerHTML = '<div class="hint">Toque no número que representa a intensidade de cada sintoma hoje. Tudo fica salvo automaticamente no aparelho.</div><div id="hoje-form"></div>';
    renderDayForm(key, document.getElementById('hoje-form'));
  }

  function renderHistorico(){
    var el = document.getElementById('view-historico');
    var keys = Object.keys(DATA.entries).sort().reverse();
    var html = '<div class="hint">Toque em um dia para revisar ou editar. Esqueceu de marcar um dia? Escolha a data abaixo.</div>';
    html += '<div class="add-day-row"><input type="date" id="pick-date" max="'+todayKey()+'"><button class="btn" id="pick-date-go">Abrir</button></div>';
    if(keys.length===0){
      html += '<div class="empty">Nenhum dia registrado ainda.<br>Comece pela aba "Hoje".</div>';
    } else {
      keys.forEach(function(key){
        var entry = DATA.entries[key];
        var dots = '';
        SYMPTOMS.forEach(function(s){
          var v = entry.vals[s.id];
          if(v && v>0){
            dots += '<span class="mini-dot l'+v+'">'+s.label+' '+v+'</span>';
          }
        });
        var sub = (entry.valsalva===true) ? 'Piorou com tosse/esforço' : '';
        html += '<div class="day-card" data-key="'+key+'">';
        html += '<div class="d-left"><div class="d-date">'+shortDateLabel(key)+'</div>';
        if(sub) html += '<div class="d-sub">⚠️ '+sub+'</div>';
        html += '<div class="d-dots">'+(dots || '<span class="d-sub">Sem sintomas marcados</span>')+'</div></div>';
        html += '<div class="chev">›</div></div>';
      });
    }
    el.innerHTML = html;

    document.getElementById('pick-date-go').addEventListener('click', function(){
      var v = document.getElementById('pick-date').value;
      if(v) openDayModal(v);
    });
    el.querySelectorAll('.day-card').forEach(function(card){
      card.addEventListener('click', function(){
        openDayModal(card.getAttribute('data-key'));
      });
    });
  }

  function openDayModal(key){
    document.getElementById('modal-title').textContent = longDateLabel(key);
    var body = document.getElementById('modal-body');
    renderDayForm(key, body, function(){ renderHistorico(); renderResumo(); });
    document.getElementById('modal').classList.add('open');
    document.getElementById('modal-backdrop').classList.add('open');
  }
  function closeModal(){
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modal-backdrop').classList.remove('open');
    renderHistorico();
    renderResumo();
  }

  function renderResumo(){
    var el = document.getElementById('view-resumo');
    var keys = Object.keys(DATA.entries).sort();
    var html = '';
    html += '<div class="field no-print"><label class="field-label">Nome do paciente</label>';
    html += '<input type="text" class="text" id="patient-name" value="'+escapeHtml(DATA.patientName||'')+'" placeholder="Ex: José da Silva"></div>';

    html += '<div class="stat-row">';
    html += '<div class="stat"><div class="n">'+keys.length+'</div><div class="l">dias registrados</div></div>';
    var period = keys.length ? (matrixDateLabel(keys[0])+' – '+matrixDateLabel(keys[keys.length-1])) : '–';
    html += '<div class="stat"><div class="n" style="font-size:14px">'+period+'</div><div class="l">período</div></div>';
    var valsalvaCount = keys.filter(function(k){return DATA.entries[k].valsalva===true;}).length;
    html += '<div class="stat"><div class="n">'+valsalvaCount+'</div><div class="l">dias c/ piora ao esforço</div></div>';
    html += '</div>';

    if(DATA.patientName){
      html += '<div style="font-size:13px;color:var(--ink2);margin-bottom:10px;">Paciente: <b>'+escapeHtml(DATA.patientName)+'</b> · Relatório gerado em '+matrixDateLabel(todayKey())+'</div>';
    }

    html += '<div class="section-title">Tabela de sintomas por dia</div>';
    if(keys.length===0){
      html += '<div class="empty">Ainda não há dados suficientes para o resumo.</div>';
    } else {
      html += '<div class="matrix-wrap"><table class="matrix"><thead><tr><th style="text-align:left">Sintoma</th>';
      keys.forEach(function(k){ html += '<th>'+matrixDateLabel(k)+'</th>'; });
      html += '</tr></thead><tbody>';
      SYMPTOMS.forEach(function(s){
        html += '<tr><td class="sym-name">'+s.label+'</td>';
        keys.forEach(function(k){
          var v = DATA.entries[k].vals[s.id];
          v = (v===undefined) ? 0 : v;
          html += '<td class="cell'+v+'">'+v+'</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';

      html += '<div class="section-title">Observações registradas</div>';
      var obsKeys = keys.filter(function(k){ return DATA.entries[k].obs && DATA.entries[k].obs.trim(); }).reverse();
      if(obsKeys.length===0){
        html += '<div class="empty" style="padding:16px 10px;">Nenhuma observação escrita ainda.</div>';
      } else {
        html += '<div class="card">';
        obsKeys.forEach(function(k){
          var e = DATA.entries[k];
          html += '<div class="obs-item"><span class="o-date">'+shortDateLabel(k)+'</span>';
          if(e.valsalva===true) html += '<span class="o-flag">piora c/ esforço</span>';
          html += '<div>'+escapeHtml(e.obs)+'</div></div>';
        });
        html += '</div>';
      }

      html += '<button class="btn block no-print" id="print-btn" style="margin-top:16px;">🖨️ Imprimir / salvar em PDF</button>';
      html += '<p class="hint no-print" style="text-align:center;">Leve este resumo para a consulta médica.</p>';
    }

    el.innerHTML = html;

    var nameInput = document.getElementById('patient-name');
    if(nameInput){
      nameInput.addEventListener('input', function(){
        DATA.patientName = nameInput.value;
        saveData();
      });
    }
    var printBtn = document.getElementById('print-btn');
    if(printBtn){ printBtn.addEventListener('click', function(){ window.print(); }); }
  }

  // ---------- Nav ----------
  var VIEWS = ['hoje','historico','resumo'];
  function switchView(name){
    VIEWS.forEach(function(v){
      document.getElementById('view-'+v).hidden = (v!==name);
    });
    document.querySelectorAll('nav.bottomnav button').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-view')===name);
    });
    if(name==='historico') renderHistorico();
    if(name==='resumo') renderResumo();
  }
  document.querySelectorAll('nav.bottomnav button').forEach(function(btn){
    btn.addEventListener('click', function(){ switchView(btn.getAttribute('data-view')); });
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', closeModal);

  // ---------- Init ----------
  document.getElementById('header-date').textContent = longDateLabel(todayKey());
  renderHoje();
})();
</script>
</body>
</html>
